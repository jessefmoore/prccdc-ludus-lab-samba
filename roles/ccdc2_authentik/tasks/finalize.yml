---
# =============================================================================
# ccdc2_authentik : finalize the LDAP outpost so SnipeIT SSH works.
# Runs on auth01 against the LOCAL authentik API using the bootstrap token:
#   1. ensure an LDAP provider (with POSIX property mappings) exists
#   2. ensure an application points at it
#   3. assign the provider to the embedded outpost (so it answers on 389/636)
# Idempotent + prints state to the deploy log. Tolerant: never fails the deploy.
# =============================================================================

- name: Set authentik API base + auth header
  ansible.builtin.set_fact:
    ccdc2_ak_api: "http://localhost:{{ ccdc2_authentik_http_port }}/api/v3"
    ccdc2_ak_hdr:
      Authorization: "Bearer {{ ccdc2_authentik_bootstrap_token }}"

- name: Wait for the authentik API to be ready
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/admin/version/"
    headers: "{{ ccdc2_ak_hdr }}"
    status_code: 200
  register: ccdc2_ak_ver
  retries: 30
  delay: 10
  until: ccdc2_ak_ver.status == 200
  failed_when: false

- name: Show authentik version
  ansible.builtin.debug:
    msg: "authentik version = {{ ccdc2_ak_ver.json.version_current | default('unknown') }}"

- name: Get the default authentication + invalidation flow pks
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/flows/instances/?slug={{ item }}"
    headers: "{{ ccdc2_ak_hdr }}"
  loop:
    - default-authentication-flow
    - default-invalidation-flow
  register: ccdc2_ak_flows
  failed_when: false

- name: Record flow pks
  ansible.builtin.set_fact:
    ccdc2_ak_authflow_pk: "{{ ccdc2_ak_flows.results[0].json.results[0].pk }}"
    ccdc2_ak_invflow_pk: "{{ ccdc2_ak_flows.results[1].json.results[0].pk }}"

- name: Get all property mappings (to attach the LDAP/POSIX ones)
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/propertymappings/all/?page_size=200"
    headers: "{{ ccdc2_ak_hdr }}"
  register: ccdc2_ak_pm
  failed_when: false

- name: Compute default LDAP property-mapping pks
  ansible.builtin.set_fact:
    ccdc2_ak_ldap_pm: >-
      {{ ccdc2_ak_pm.json.results
         | selectattr('name', 'search', 'LDAP Mapping')
         | map(attribute='pk') | list }}

- name: List existing LDAP providers
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/providers/ldap/"
    headers: "{{ ccdc2_ak_hdr }}"
  register: ccdc2_ak_ldapprov
  failed_when: false

- name: Create the LDAP provider (new-schema bind_flow/unbind_flow)
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/providers/ldap/"
    method: POST
    headers: "{{ ccdc2_ak_hdr }}"
    body_format: json
    body:
      name: "CCDC2 LDAP Provider"
      base_dn: "{{ ccdc2_authentik_ldap_base_dn }}"
      bind_flow: "{{ ccdc2_ak_authflow_pk }}"
      unbind_flow: "{{ ccdc2_ak_invflow_pk }}"
      bind_mode: cached
      search_mode: cached
      mfa_support: false
      property_mappings: "{{ ccdc2_ak_ldap_pm }}"
    status_code: [201, 400]
  register: ccdc2_ak_create_new
  when: ccdc2_ak_ldapprov.json.results | selectattr('name', 'equalto', 'CCDC2 LDAP Provider') | list | length == 0
  failed_when: false

- name: Create the LDAP provider (fallback old-schema authorization_flow)
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/providers/ldap/"
    method: POST
    headers: "{{ ccdc2_ak_hdr }}"
    body_format: json
    body:
      name: "CCDC2 LDAP Provider"
      base_dn: "{{ ccdc2_authentik_ldap_base_dn }}"
      authorization_flow: "{{ ccdc2_ak_authflow_pk }}"
      property_mappings: "{{ ccdc2_ak_ldap_pm }}"
    status_code: [201, 400]
  register: ccdc2_ak_create_old
  when:
    - ccdc2_ak_ldapprov.json.results | selectattr('name', 'equalto', 'CCDC2 LDAP Provider') | list | length == 0
    - ccdc2_ak_create_new.status | default(0) != 201
  failed_when: false

- name: Re-list LDAP providers (resolve the provider pk)
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/providers/ldap/"
    headers: "{{ ccdc2_ak_hdr }}"
  register: ccdc2_ak_ldapprov2
  failed_when: false

- name: Record the LDAP provider pk
  ansible.builtin.set_fact:
    ccdc2_ak_provider_pk: >-
      {{ (ccdc2_ak_ldapprov2.json.results
          | selectattr('name', 'equalto', 'CCDC2 LDAP Provider')
          | map(attribute='pk') | list | first) | default('') }}

- name: Show provider result
  ansible.builtin.debug:
    msg: >-
      LDAP provider pk={{ ccdc2_ak_provider_pk }}
      (new POST status={{ ccdc2_ak_create_new.status | default('skip') }},
       old POST status={{ ccdc2_ak_create_old.status | default('skip') }})

- name: Ensure an application points at the LDAP provider
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/core/applications/"
    method: POST
    headers: "{{ ccdc2_ak_hdr }}"
    body_format: json
    body:
      name: "CCDC2 LDAP (SSH)"
      slug: "ccdc2-ldap"
      provider: "{{ ccdc2_ak_provider_pk }}"
    status_code: [201, 400]
  when: ccdc2_ak_provider_pk | length > 0
  failed_when: false

- name: Get the embedded outpost
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/outposts/instances/?page_size=50"
    headers: "{{ ccdc2_ak_hdr }}"
  register: ccdc2_ak_outposts
  failed_when: false

- name: Record the embedded outpost pk + current providers
  ansible.builtin.set_fact:
    ccdc2_ak_outpost_pk: >-
      {{ (ccdc2_ak_outposts.json.results
          | selectattr('name', 'search', 'Embedded')
          | map(attribute='pk') | list | first) | default('') }}
    ccdc2_ak_outpost_providers: >-
      {{ (ccdc2_ak_outposts.json.results
          | selectattr('name', 'search', 'Embedded')
          | map(attribute='providers') | list | first) | default([]) }}

- name: Assign the LDAP provider to the embedded outpost
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/outposts/instances/{{ ccdc2_ak_outpost_pk }}/"
    method: PATCH
    headers: "{{ ccdc2_ak_hdr }}"
    body_format: json
    body:
      providers: "{{ (ccdc2_ak_outpost_providers + [ccdc2_ak_provider_pk | int]) | unique }}"
    status_code: [200, 400]
  when:
    - ccdc2_ak_outpost_pk | length > 0
    - ccdc2_ak_provider_pk | length > 0
  register: ccdc2_ak_patch
  failed_when: false

- name: Confirm the embedded outpost now serves the LDAP provider
  ansible.builtin.uri:
    url: "{{ ccdc2_ak_api }}/outposts/instances/{{ ccdc2_ak_outpost_pk }}/"
    headers: "{{ ccdc2_ak_hdr }}"
  register: ccdc2_ak_outpost_final
  when: ccdc2_ak_outpost_pk | length > 0
  failed_when: false

- name: Show final outpost provider assignment
  ansible.builtin.debug:
    msg: >-
      Embedded outpost providers = {{ ccdc2_ak_outpost_final.json.providers | default('n/a') }}
      (LDAP provider pk {{ ccdc2_ak_provider_pk }} should be listed)
