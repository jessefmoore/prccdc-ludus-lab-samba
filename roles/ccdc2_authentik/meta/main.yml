    can authenticate SSH against authentik. Ships a starter LDAP provider
    blueprint. Idempotent.
  license: MIT
  min_ansible_version: "2.12"
  platforms:
    - name: Ubuntu
      versions:
        - all
    - name: Debian
      versions:
        - all
  galaxy_tags:
    - authentik
    - sso
    - identity
    - ldap
    - docker
    - ccdc2
dependencies: []
