---
# =============================================================================
# ccdc2_samba_dc — provision a Samba AD Domain Controller (ccdc.local)
# Order: preseed krb5 -> install -> disable conflicting smbd/nmbd/winbind ->
# provision (once) -> krb5.conf -> point DNS at self -> start samba-ad-dc ->
# relax password policy -> seed groups/users. Idempotent + safe to re-run.
# =============================================================================

# --- Kerberos preseed so krb5-user install never blocks on a prompt ----------
- name: Preseed krb5 default realm (debconf)
  ansible.builtin.debconf:
    name: krb5-config
    question: krb5-config/default_realm
    value: "{{ ccdc2_samba_dc_realm }}"
    vtype: string

- name: Preseed krb5 add-servers-to-existing (debconf)
  ansible.builtin.debconf:
    name: krb5-config
    question: krb5-config/add_servers_realm
    value: "{{ ccdc2_samba_dc_realm }}"
    vtype: string

# --- Packages ----------------------------------------------------------------
- name: Install Samba AD DC + Kerberos packages
  ansible.builtin.apt:
    name:
      - samba
      - samba-ad-provision   # AD schema .ldf files required by `samba-tool domain provision` (Debian 12)
      - smbclient
      - samba-dsdb-modules
      - samba-vfs-modules
      - winbind
      - libpam-winbind
      - libnss-winbind
      - krb5-user
      - dnsutils
      - ldb-tools
      - acl
      - attr
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: ccdc2_dc_apt
  retries: 3
  delay: 10
  until: ccdc2_dc_apt is succeeded

# --- Ensure the DC resolves its own FQDN via /etc/hosts ----------------------
- name: Ensure /etc/hosts maps this host's real FQDN and short name
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ ccdc2_samba_dc_ip | regex_escape }}\s'
    line: "{{ ccdc2_samba_dc_ip }} {{ ansible_hostname }}.{{ ccdc2_samba_dc_dns_domain }} {{ ansible_hostname }}"
    state: present

# --- Detect prior provisioning ----------------------------------------------
- name: Check whether Samba AD has already been provisioned
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: ccdc2_dc_samdb

# --- Stop + disable the standalone Samba daemons (AD DC uses samba-ad-dc) -----
# These conflict with the unified samba-ad-dc service; mask so nothing restarts
# them on boot. Done before provisioning.
- name: Stop conflicting Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop: [smbd, nmbd, winbind]
  failed_when: false

- name: Disable and mask conflicting Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    masked: true
  loop: [smbd, nmbd, winbind]
  failed_when: false

# --- Fresh provision (only when not already provisioned) ---------------------
- name: Remove the default smb.conf so provisioning writes a fresh one
  ansible.builtin.file:
    path: /etc/samba/smb.conf
    state: absent
  when: not ccdc2_dc_samdb.stat.exists

- name: Provision the Samba AD domain (internal DNS backend)
  ansible.builtin.command:
    cmd: >-
      samba-tool domain provision
      --use-rfc2307
      --realm={{ ccdc2_samba_dc_realm }}
      --domain={{ ccdc2_samba_dc_netbios_domain }}
      --server-role=dc
      --dns-backend=SAMBA_INTERNAL
      --adminpass={{ ccdc2_samba_dc_admin_password }}
  register: ccdc2_dc_provision
  when: not ccdc2_dc_samdb.stat.exists
  changed_when: ccdc2_dc_provision.rc == 0
  no_log: true

# --- Kerberos client config generated by the provision ------------------------
- name: Install the Samba-generated krb5.conf system-wide
  ansible.builtin.copy:
    src: /var/lib/samba/private/krb5.conf
    dest: /etc/krb5.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"

# --- Make sure the "dns forwarder" is present in smb.conf (idempotent) -------
- name: Ensure the DNS forwarder is configured in smb.conf
  ansible.builtin.lineinfile:
    path: /etc/samba/smb.conf
    insertafter: '^\[global\]'
    regexp: '^\s*dns forwarder\s*='
    line: "\tdns forwarder = {{ ccdc2_samba_dc_dns_forwarder }}"
    state: present
  notify: Restart samba-ad-dc

# --- Point the DC's own resolver at itself (Samba internal DNS) --------------
# systemd-resolved's stub listener conflicts with Samba on :53, so disable it
# and use a static resolv.conf pointing at 127.0.0.1.
- name: Detect whether systemd-resolved is active
  ansible.builtin.command: systemctl is-active systemd-resolved
  register: ccdc2_dc_resolved
  changed_when: false
  failed_when: false

- name: Disable the systemd-resolved stub listener (frees :53 for Samba DNS)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ccdc2_samba_dc — Samba internal DNS owns :53 on this host.
      [Resolve]
      DNS=127.0.0.1
      Domains={{ ccdc2_samba_dc_dns_domain }}
      DNSStubListener=no
  when: ccdc2_dc_resolved.stdout | trim == 'active'
  register: ccdc2_dc_resolvedconf

- name: Restart systemd-resolved to release :53
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when:
    - ccdc2_dc_resolved.stdout | trim == 'active'
    - ccdc2_dc_resolvedconf is changed

- name: Replace /etc/resolv.conf (unmanaged) pointing at the local Samba DNS
  block:
    - name: Remove any existing resolv.conf symlink/file
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent
    - name: Write static resolv.conf pointing at 127.0.0.1
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ccdc2_samba_dc
          search {{ ccdc2_samba_dc_dns_domain }}
          nameserver 127.0.0.1

# --- Start the unified AD DC service -----------------------------------------
- name: Unmask, enable and start samba-ad-dc
  ansible.builtin.systemd:
    name: samba-ad-dc
    masked: false
    enabled: true
    state: started

- name: Apply any pending restart of samba-ad-dc now
  ansible.builtin.meta: flush_handlers

- name: Wait for the AD DC to answer (samba-tool domain level show)
  ansible.builtin.command: samba-tool domain level show
  register: ccdc2_dc_level
  changed_when: false
  retries: 12
  delay: 5
  until: ccdc2_dc_level.rc == 0

# --- Relax the password policy for the lab (so seeded creds never expire) -----
- name: Relax the domain password policy (lab)
  ansible.builtin.command:
    cmd: >-
      samba-tool domain passwordsettings set
      --complexity=off
      --history-length=0
      --min-pwd-age=0
      --max-pwd-age=0
  when: ccdc2_samba_dc_relax_password_policy | bool
  changed_when: true

# --- Seed groups, service account and users ----------------------------------
- name: Seed AD groups, service account and users
  ansible.builtin.include_tasks: accounts.yml
