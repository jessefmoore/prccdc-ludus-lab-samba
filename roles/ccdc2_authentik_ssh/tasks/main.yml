---
# =============================================================================
# ccdc2_authentik_ssh — make SSH on this host authenticate against the authentik
# LDAP outpost. Tolerant: if the outpost isn't finalized yet, SSSD simply runs
# offline and local (Ludus) logins keep working, so the deploy never fails here.
# =============================================================================

- name: Install SSSD + LDAP client packages
  ansible.builtin.apt:
    name:
      - sssd
      - sssd-ldap
      - libnss-sss
      - libpam-sss
      - ldap-utils
      - oddjob
      - oddjob-mkhomedir
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: ccdc2_authssh_apt
  retries: 3
  delay: 10
  until: ccdc2_authssh_apt is succeeded

- name: Deploy the SSSD config pointing at the authentik LDAP outpost
  ansible.builtin.template:
    src: sssd-authentik.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sssd

- name: Ensure sss is in nsswitch for passwd/group/shadow
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^{{ item }}:'
    line: "{{ item }}:         files systemd sss"
  loop:
    - passwd
    - group
    - shadow

- name: Enable pam_sss and home-dir creation on login
  ansible.builtin.command: "pam-auth-update --enable {{ item }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  loop:
    - sss
    - mkhomedir
  changed_when: true

- name: Ensure oddjobd is running (home-dir helper)
  ansible.builtin.service:
    name: oddjobd
    state: started
    enabled: true
  failed_when: false

- name: Apply pending SSSD restart
  ansible.builtin.meta: flush_handlers

- name: Ensure SSSD is enabled and running
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true
  failed_when: false

# --- Verify the authentik LDAP outpost answers + serves a user (tolerant) -----
- name: Restart SSSD to reconnect to the (now finalized) outpost
  ansible.builtin.service:
    name: sssd
    state: restarted
  failed_when: false

- name: LDAP bind test against the authentik outpost (retry while it warms up)
  ansible.builtin.command: >-
    ldapsearch -x -H {{ ccdc2_authentik_ssh_ldap_uri }}
    -D "{{ ccdc2_authentik_ssh_bind_dn }}" -w "{{ ccdc2_authentik_ssh_bind_password }}"
    -b "{{ ccdc2_authentik_ssh_base_dn }}" -s sub "(cn=akadmin)" dn uidNumber
  register: ccdc2_authssh_bind
  changed_when: false
  failed_when: false
  no_log: true
  retries: 12
  delay: 10
  until: ccdc2_authssh_bind.rc == 0

- name: Show LDAP bind test result
  ansible.builtin.debug:
    msg: >-
      authentik LDAP outpost bind {{ 'OK' if ccdc2_authssh_bind.rc == 0 else 'FAILED (rc=' ~ ccdc2_authssh_bind.rc ~ ')' }};
      akadmin entry {{ 'found' if ('numEntries' in (ccdc2_authssh_bind.stdout | default('')) or 'dn:' in (ccdc2_authssh_bind.stdout | default(''))) else 'not returned' }}

- name: Bounce SSSD now that the outpost is confirmed serving
  ansible.builtin.service:
    name: sssd
    state: restarted
  failed_when: false
  when: ccdc2_authssh_bind.rc == 0

- name: Resolve an authentik user via NSS (SSSD)
  ansible.builtin.command: getent passwd akadmin
  register: ccdc2_authssh_getent
  changed_when: false
  failed_when: false
  retries: 6
  delay: 10
  until: ccdc2_authssh_getent.rc == 0

- name: Show NSS resolution result
  ansible.builtin.debug:
    msg: >-
      getent passwd akadmin -> {{ ccdc2_authssh_getent.stdout | default('(no result)') if ccdc2_authssh_getent.rc == 0 else '(not resolvable yet)' }}

- name: (diagnostic) Fail conclusively if authentik SSH LDAP is not working
  ansible.builtin.fail:
    msg: >-
      authentik SSH LDAP NOT working: bind_rc={{ ccdc2_authssh_bind.rc }}
      (255=can't-contact/listener-down, 49=bad-creds);
      getent_rc={{ ccdc2_authssh_getent.rc }};
      getent_out={{ ccdc2_authssh_getent.stdout | default('') }}
  when: ccdc2_authssh_bind.rc != 0 or ccdc2_authssh_getent.rc != 0

