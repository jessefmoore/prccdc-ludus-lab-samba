---
# ==============================================================================
# ccdc2_mantis
# Native (no Docker) MantisBT install: Apache + mod_php + the upstream
# mantisbt.org release tarball, connected to the range's CENTRAL MariaDB host.
# Order: packages -> download+extract tarball -> config_inc.php -> apache up
# -> idempotent remote schema check -> drive admin/install.php once to create
# the MantisBT tables. Safe to re-run.
# ==============================================================================

# --- Package installation ----------------------------------------------------
- name: Install Apache, PHP and MariaDB client packages
  ansible.builtin.apt:
    name: "{{ ccdc2_mantis_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: ccdc2_mantis_apt
  retries: 3
  delay: 10
  until: ccdc2_mantis_apt is succeeded

# --- Detect whether MantisBT is already extracted -----------------------------
- name: Check whether MantisBT is already extracted
  ansible.builtin.stat:
    path: "{{ ccdc2_mantis_webroot }}/core.php"
  register: ccdc2_mantis_core_stat

# --- Download the upstream release tarball ------------------------------------
- name: Create download staging directory ({{ ccdc2_mantis_download_dir }})
  ansible.builtin.file:
    path: "{{ ccdc2_mantis_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download MantisBT {{ ccdc2_mantis_version }} release tarball
  ansible.builtin.get_url:
    url: "{{ ccdc2_mantis_download_url }}"
    dest: "{{ ccdc2_mantis_download_dir }}/mantisbt-{{ ccdc2_mantis_version }}.tar.gz"
    mode: "0644"
    timeout: 120
    validate_certs: false
  when: not ccdc2_mantis_core_stat.stat.exists
  register: ccdc2_mantis_download
  retries: 3
  delay: 10
  until: ccdc2_mantis_download is succeeded

# --- Extract into the Apache DocumentRoot -------------------------------------
- name: Ensure the MantisBT webroot directory exists ({{ ccdc2_mantis_webroot }})
  ansible.builtin.file:
    path: "{{ ccdc2_mantis_webroot }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Extract MantisBT tarball into the webroot (strip top-level dir)
  ansible.builtin.unarchive:
    src: "{{ ccdc2_mantis_download_dir }}/mantisbt-{{ ccdc2_mantis_version }}.tar.gz"
    dest: "{{ ccdc2_mantis_webroot }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ ccdc2_mantis_webroot }}/core.php"
  register: ccdc2_mantis_extract

# --- Ownership -----------------------------------------------------------------
- name: Set www-data ownership on the MantisBT tree
  ansible.builtin.file:
    path: "{{ ccdc2_mantis_webroot }}"
    owner: www-data
    group: www-data
    recurse: true
    state: directory

# --- Application config ---------------------------------------------------------
- name: Ensure the MantisBT config directory exists
  ansible.builtin.file:
    path: "{{ ccdc2_mantis_webroot }}/config"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy config/config_inc.php (points at the central MariaDB host)
  ansible.builtin.template:
    src: config_inc.php.j2
    dest: "{{ ccdc2_mantis_webroot }}/config/config_inc.php"
    owner: www-data
    group: www-data
    mode: "0640"
  notify: Restart apache2

# --- Web server -------------------------------------------------------------
- name: Ensure apache2 is enabled and running
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

# Apply the config-file restart now so Apache serves the current config
# before we drive the schema installer below.
- name: Apply pending handlers (restart apache2) before schema install
  ansible.builtin.meta: flush_handlers

- name: Wait for MantisBT to be served over HTTP (localhost)
  ansible.builtin.uri:
    url: "http://localhost/mantis/admin/install.php"
    status_code: [200]
    return_content: false
  register: ccdc2_mantis_http_check
  retries: 12
  delay: 5
  until: ccdc2_mantis_http_check.status == 200

# --- Idempotent remote schema check -------------------------------------------
# Query the central MariaDB host directly (no local DB, no community.mysql
# collection available) to see whether MantisBT's schema has already been
# installed. Password is passed via MYSQL_PWD so it never appears in argv/ps.
- name: Check whether the MantisBT schema already exists on the central DB
  ansible.builtin.command:
    argv:
      - mysql
      - "--host={{ ccdc2_mantis_db_host }}"
      - "--user={{ ccdc2_mantis_db_user }}"
      - "--batch"
      - "--skip-column-names"
      - "--execute=SHOW TABLES LIKE 'mantis_config_table';"
      - "{{ ccdc2_mantis_db_name }}"
  environment:
    MYSQL_PWD: "{{ ccdc2_mantis_db_password }}"
  register: ccdc2_mantis_schema_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Record whether the MantisBT schema is already installed
  ansible.builtin.set_fact:
    ccdc2_mantis_schema_present: >-
      {{ ccdc2_mantis_schema_check.rc == 0 and
         'mantis_config_table' in ccdc2_mantis_schema_check.stdout }}

# --- Drive the MantisBT web installer non-interactively -----------------------
# admin/install.php is a state machine driven by the "install" POST param.
# Posting install=2 together with the DB parameters causes it to run every
# remaining step (create tables, write config check, post-install checks) in
# a single request/response, because config/config_inc.php already exists on
# disk (deployed above) with matching credentials. This is a best-effort
# automation of MantisBT's only supported schema-install path; if MantisBT
# changes this wizard's internals in a future release this step may need
# re-verification (see README for the manual fallback).
#
# path="" is required: MantisBT auto-derives $g_path from the HTTP request
# when unset, then (during install) tries to self-fetch that URL to validate
# it; that outbound self-fetch fails inside a fresh container/VM and turns
# into a HARD failure that aborts the whole install. Explicitly posting an
# empty path takes the "empty path is a security risk" SOFT-warning branch
# instead, which does not abort installation (verified in a throwaway
# Debian+Apache+MariaDB container while authoring this role).
- name: Run the MantisBT schema installer (admin/install.php) once
  ansible.builtin.uri:
    url: "http://localhost/mantis/admin/install.php"
    method: POST
    body_format: form-urlencoded
    body:
      install: 2
      hostname: "{{ ccdc2_mantis_db_host }}"
      db_type: mysqli
      database_name: "{{ ccdc2_mantis_db_name }}"
      db_username: "{{ ccdc2_mantis_db_user }}"
      db_password: "{{ ccdc2_mantis_db_password }}"
      admin_username: "{{ ccdc2_mantis_db_user }}"
      admin_password: "{{ ccdc2_mantis_db_password }}"
      path: ""
    status_code: [200]
    timeout: 120
  when: not ccdc2_mantis_schema_present
  register: ccdc2_mantis_install_post
  failed_when: false
  no_log: true

- name: Re-check the MantisBT schema on the central DB after install attempt
  ansible.builtin.command:
    argv:
      - mysql
      - "--host={{ ccdc2_mantis_db_host }}"
      - "--user={{ ccdc2_mantis_db_user }}"
      - "--batch"
      - "--skip-column-names"
      - "--execute=SHOW TABLES LIKE 'mantis_config_table';"
      - "{{ ccdc2_mantis_db_name }}"
  environment:
    MYSQL_PWD: "{{ ccdc2_mantis_db_password }}"
  register: ccdc2_mantis_schema_recheck
  changed_when: false
  failed_when: false
  no_log: true
  when: not ccdc2_mantis_schema_present

- name: Record final MantisBT schema state
  ansible.builtin.set_fact:
    ccdc2_mantis_schema_ok: >-
      {{ ccdc2_mantis_schema_present or
         (ccdc2_mantis_schema_recheck is defined and
          ccdc2_mantis_schema_recheck.rc is defined and
          ccdc2_mantis_schema_recheck.rc == 0 and
          'mantis_config_table' in ccdc2_mantis_schema_recheck.stdout) }}

- name: WARN - automated schema install did not complete
  ansible.builtin.debug:
    msg: >-
      MantisBT tables were not detected on {{ ccdc2_mantis_db_host }}/{{ ccdc2_mantis_db_name }}
      after driving admin/install.php automatically. Finish the install manually by
      browsing to http://{{ ansible_default_ipv4.address | default('<this-host>') }}/mantis/admin/install.php
      and clicking "Install/Upgrade Database" (config/config_inc.php is already correct,
      so the form will be pre-filled). See this role's README for details.
  when: not ccdc2_mantis_schema_ok

- name: MantisBT install summary
  ansible.builtin.debug:
    msg: >-
      MantisBT schema present: {{ ccdc2_mantis_schema_ok }}.
      App URL: http://{{ ansible_default_ipv4.address | default('<this-host>') }}/mantis/login_page.php
