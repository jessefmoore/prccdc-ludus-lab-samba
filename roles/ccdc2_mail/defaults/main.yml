---
# =============================================================================
# ccdc2_mail — defaults (all namespaced ccdc2_mail_*)
# docker-mailserver (Postfix/Dovecot) + Roundcube webmail, authenticating mail
# users against the Samba AD DC over LDAP.
# =============================================================================

ccdc2_mail_stack_dir: "/opt/ccdc2/mail"

# Mail identity.
ccdc2_mail_domain: "ccdc.local"
ccdc2_mail_hostname: "mail.ccdc.local"

# Images.
ccdc2_mail_dms_image: "docker.io/mailserver/docker-mailserver:latest"
ccdc2_mail_roundcube_image: "docker.io/roundcube/roundcubemail:latest"

# Webmail (Roundcube) HTTP port on this host.
ccdc2_mail_webmail_port: 80

# --- Samba AD / LDAP integration ---------------------------------------------
# Users authenticate with their AD credentials; mailboxes are provisioned from
# LDAP (each seeded AD user has mail = <user>@ccdc.local).
ccdc2_mail_ldap_host: "10.51.10.10"
ccdc2_mail_ldap_search_base: "dc=ccdc,dc=local"
ccdc2_mail_ldap_bind_dn: "CN=svc_ldap,CN=Users,dc=ccdc,dc=local"
ccdc2_mail_ldap_bind_pw: "CCDC2-Svc-2026!"
